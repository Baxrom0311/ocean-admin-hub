name: Admin Hub CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-build:
    name: Lint, Test & Build (ocean-admin-hub)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: https://api.ecocompany.uz/api/v1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocean-admin-hub-dist
          path: dist/
          retention-days: 7
